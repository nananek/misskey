name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - nananek
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: echo "image=ghcr.io/${{ github.repository }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push (SHA tag)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: misskey
          POSTGRES_PASSWORD: misskey
          POSTGRES_DB: misskey
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 6379:6379
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create test config
        run: |
          mkdir -p /tmp/misskey-config
          cat > /tmp/misskey-config/default.yml << 'EOF'
          url: http://localhost:3000
          port: 3000
          db:
            host: localhost
            port: 5432
            db: misskey
            user: misskey
            pass: misskey
          redis:
            host: localhost
            port: 6379
          id: aidx
          EOF

      - name: Start Misskey
        run: |
          docker run -d --name misskey-ci \
            --network host \
            -v /tmp/misskey-config:/misskey/.config:ro \
            ${{ needs.build.outputs.image }}

      - name: Wait for /healthz
        run: |
          echo "Waiting for Misskey to start (up to 5 minutes)..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/healthz; then
              echo ""
              echo "OK: Misskey started (attempt $i)"
              exit 0
            fi
            echo "[$i/60] not ready, retrying in 5s..."
            sleep 5
          done
          echo "Misskey did not start within 5 minutes"
          docker logs misskey-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker stop misskey-ci 2>/dev/null || true

  promote:
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Promote to latest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:latest \
            ${{ needs.build.outputs.image }}
