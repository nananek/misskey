name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - nananek
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (SHA tag)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          set -euo pipefail

          echo "==> node binary"
          docker run --rm --entrypoint /nodejs/bin/node $IMAGE --version

          echo "==> docker-start.js syntax"
          docker run --rm --entrypoint /nodejs/bin/node $IMAGE --check /misskey/scripts/docker-start.js

          echo "==> healthcheck.js syntax"
          docker run --rm --entrypoint /nodejs/bin/node $IMAGE --check /misskey/healthcheck.js

          echo "==> ffmpeg"
          docker run --rm --entrypoint /usr/local/bin/ffmpeg $IMAGE -version

          echo "==> tini + node"
          docker run --rm --entrypoint /tini $IMAGE -- /nodejs/bin/node -e "process.exit(0)"

      - name: Promote to latest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:${{ github.sha }}
